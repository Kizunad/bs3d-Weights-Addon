// 单机内置服务器复用 server 的权威实现，客户端界面只消费服务器快照。
sourceSets.main.java.srcDir rootProject.file('server/src/main/java')

dependencies {
    // 组合进来的 Loom 工程直接取 named 开发 JAR：按坐标走 mod 重映射的缓存不随上游改动刷新，也不会先构建上游。
    implementation('dev.kizuna.inventoryui:kizuna-inventory-ui-framework') { targetConfiguration = 'namedElements' }
    implementation('dev.kizuna.backpack3d:client') { targetConfiguration = 'namedElements' }
    // Framework 与 BS3D 的客户端产物不再内含服务端路由和库存访问，内置服务器代码改从两端共用的服务端产物编译。
    implementation('dev.kizuna.inventoryui:server') { targetConfiguration = 'namedElements' }
    implementation('dev.kizuna.backpack3d:server') { targetConfiguration = 'namedElements' }
    modImplementation libs.owo
    // 内置服务器读取有效负重系数表；同版本解析库与 BS3D 客户端内嵌的一份由加载器去重。
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
}
loom.runs {
    smoke {
        client()
        source sourceSets.smoke
        runDir "../build/smoke/${rootProject.findProperty('smokeRun') ?: 'manual'}/client"
        property 'weights.smoke.mode', rootProject.findProperty('smokeMode') ?: 'dedicated'
        property 'weights.smoke.address', "127.0.0.1:${rootProject.findProperty('smokePort') ?: '25583'}"
        programArgs '--username', 'WeightsSmoke', '--width', '1280', '--height', '720'
    }
}
