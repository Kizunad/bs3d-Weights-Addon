// 单机内置服务器复用 server 的权威实现，客户端界面只消费服务器快照。
sourceSets.main.java.srcDir rootProject.file('server/src/main/java')

dependencies {
    modImplementation files(new File(rootProject.frameworkDir, 'build/libs/kizuna-inventory-ui-framework-0.1.0-SNAPSHOT.jar'))
    modImplementation files(new File(rootProject.bs3dDir, 'client/build/libs/backpack-storage-3d-client-0.1.0-SNAPSHOT.jar'))
    // Framework 与 BS3D 的客户端产物不再内含服务端路由和库存访问，内置服务器代码改从两端共用的服务端产物编译。
    modImplementation files(new File(rootProject.frameworkDir, 'server/build/libs/kizuna-inventory-ui-framework-server-0.1.0-SNAPSHOT.jar'))
    modImplementation files(new File(rootProject.bs3dDir, 'server/build/libs/backpack-storage-3d-server-0.1.0-SNAPSHOT.jar'))
    modImplementation 'io.wispforest:owo-lib:0.11.2+1.20'
    // 内置服务器读取有效负重系数表；同版本解析库与 BS3D 客户端内嵌的一份由加载器去重。
    include implementation('org.tomlj:tomlj:1.1.1')
    include implementation('org.antlr:antlr4-runtime:4.11.1')
}
loom.runs {
    smoke {
        client()
        source sourceSets.smoke
        runDir "../build/smoke/${rootProject.findProperty('smokeRun') ?: 'manual'}/client"
        property 'weights.smoke.mode', rootProject.findProperty('smokeMode') ?: 'dedicated'
        property 'weights.smoke.address', "127.0.0.1:${rootProject.findProperty('smokePort') ?: '25583'}"
        programArgs '--username', 'WeightsSmoke', '--width', '1280', '--height', '720'
    }
}
