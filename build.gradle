plugins {
    id 'base'
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.protobuf) apply false
}

ext {
    // 公共 proto 只取 Inventory UI Framework 仓库的唯一源；其他布局通过 -Pkizuna.dir.inventory-ui 指定。
    frameworkDir = kizunaWorkspace.directory('inventory-ui')
}

subprojects {
    apply plugin: 'fabric-loom'
    apply plugin: 'com.google.protobuf'
    group = 'dev.kizuna.bs3d.weights'
    version = '0.1.0-SNAPSHOT'
    base.archivesName = "bs3d-weights-addon-${project.name}"
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wispforest.io/releases' }
        mavenCentral()
    }
    java {
        sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.java.get().toInteger()
        options.encoding = 'UTF-8'
    }
    dependencies {
        minecraft libs.minecraft
        mappings "net.fabricmc:yarn:${libs.versions.yarn.get()}:v2"
        modImplementation libs.fabric.loader
        modImplementation libs.fabric.api
        implementation libs.protobuf.java
        testImplementation libs.junit.jupiter
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    sourceSets.main {
        java.srcDir rootProject.file('shared/src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
        proto.srcDir rootProject.file('shared/src/main/proto')
    }
    sourceSets.create('smoke') {
        java.srcDir rootProject.file('smoke/src/main/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    protobuf {
        protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}" }
        generateProtoTasks {
            ofSourceSet('main').configureEach { task ->
                task.generateDescriptorSet = true
                task.descriptorSetOptions.path = layout.buildDirectory.file('descriptors/weights-v1.desc').get().asFile.path
                task.descriptorSetOptions.includeImports = true
            }
        }
    }
    test { useJUnitPlatform() }
    processResources {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') { expand version: project.version }
    }
    jar { from rootProject.file('LICENSE') }
    loom {
        mods {
            'bs3d_weights_addon' { sourceSet sourceSets.main }
            'bs3d_weights_smoke' { sourceSet sourceSets.smoke }
        }
    }
}

tasks.register('protocolZip', Zip) {
    dependsOn ':server:generateProto'
    archiveFileName = 'bs3d-weights-addon-0.1.0-SNAPSHOT-proto.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('shared/src/main/proto')
    from(new File(frameworkDir, 'src/main/proto'))
    from(project(':server').layout.buildDirectory.file('descriptors/weights-v1.desc')) { into 'descriptors' }
    from('LICENSE')
}
tasks.named('build') { dependsOn ':client:build', ':server:build', 'protocolZip' }
tasks.named('check') { dependsOn ':client:check', ':server:check' }
