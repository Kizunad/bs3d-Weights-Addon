dependencies {
    // 与 client 相同，组合工程按坐标替换为上游源码工程，直接取其普通 JAR。
    implementation 'dev.kizuna.inventoryui:server'
    implementation 'dev.kizuna.backpack3d:server'
    testImplementation libs.fabric.junit
    // 有效负重系数表是 TOML；专用服务器没有 BS3D 客户端内嵌的解析库，由本附属自带。
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
}
test {
    systemProperty 'fabric.side', 'server'
    // 物品登记须在注册表冻结前、标签绑定须在冻结后，各测试类独占 JVM，互不改变对方的注册表状态。
    forkEvery = 1
}
loom.runs {
    smoke {
        server()
        source sourceSets.smoke
        runDir "../build/smoke/${rootProject.findProperty('smokeRun') ?: 'manual'}/server"
        property 'weights.smoke.mode', 'dedicated'
        if (rootProject.hasProperty('smokeMeasure')) {
            property 'weights.smoke.measure', 'true'
        }
        programArg 'nogui'
    }
}

// 无客户端的算重检查复用 smoke 专服，每次用独立目录，成功标记必须由本次运行生成。
def measureRun = rootProject.findProperty('smokeRun') ?: 'manual'
def measureDirectory = rootProject.file("build/smoke/${measureRun}/server")
tasks.register('prepareMeasureSmoke') {
    onlyIf { rootProject.hasProperty('smokeMeasure') }
    doLast {
        if (!(measureRun ==~ /[A-Za-z0-9_-]+/) || measureRun == 'manual') {
            throw new GradleException('算重 smoke 必须用 -PsmokeRun 指定新的独立目录名')
        }
        if (new File(measureDirectory, 'eula.txt').exists() || new File(measureDirectory, 'world').exists()) {
            throw new GradleException("算重 smoke 目录已存在，请更换 smokeRun：${measureDirectory}")
        }
        measureDirectory.mkdirs()
        new File(measureDirectory, 'eula.txt').text = 'eula=true\n'
        new File(measureDirectory, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
view-distance=2
simulation-distance=2
max-players=1
spawn-protection=0
level-type=minecraft:flat
generate-structures=false
difficulty=peaceful
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1}],"biome":"minecraft:plains"}
'''
    }
}
tasks.named('runSmoke') {
    dependsOn 'prepareMeasureSmoke'
    doLast {
        if (rootProject.hasProperty('smokeMeasure')) {
            def marker = new File(measureDirectory, 'weights-measure-ok.txt')
            if (!marker.isFile() || marker.text.trim() != 'WEIGHTS_MEASURE_OK cases=5') {
                throw new GradleException('算重 smoke 未通过，缺少完整成功标记，请检查 WEIGHTS_MEASURE_FAILED')
            }
        }
    }
}
