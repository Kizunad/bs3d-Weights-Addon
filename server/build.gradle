dependencies {
    modImplementation files(new File(rootProject.frameworkDir, 'server/build/libs/kizuna-inventory-ui-framework-server-0.1.0-SNAPSHOT.jar'))
    modImplementation files(new File(rootProject.bs3dDir, 'server/build/libs/backpack-storage-3d-server-0.1.0-SNAPSHOT.jar'))
    testImplementation 'net.fabricmc:fabric-loader-junit:0.16.10'
    // 有效负重系数表是 TOML；专用服务器没有 BS3D 客户端内嵌的解析库，由本附属自带。
    include implementation('org.tomlj:tomlj:1.1.1')
    include implementation('org.antlr:antlr4-runtime:4.11.1')
}
test { systemProperty 'fabric.side', 'server' }
loom.runs {
    smoke {
        server()
        source sourceSets.smoke
        runDir "../build/smoke/${rootProject.findProperty('smokeRun') ?: 'manual'}/server"
        property 'weights.smoke.mode', 'dedicated'
        programArg 'nogui'
    }
}
