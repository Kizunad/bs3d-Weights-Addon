dependencies {
    // 与 client 相同，组合工程取 named 开发 JAR，避免 mod 重映射缓存滞后于上游源码。
    implementation('local.inventory-ui:server') { targetConfiguration = 'namedElements' }
    implementation('local.bs3d:server') { targetConfiguration = 'namedElements' }
    testImplementation libs.fabric.junit
    // 有效负重系数表是 TOML；专用服务器没有 BS3D 客户端内嵌的解析库，由本附属自带。
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
}
test { systemProperty 'fabric.side', 'server' }
loom.runs {
    smoke {
        server()
        source sourceSets.smoke
        runDir "../build/smoke/${rootProject.findProperty('smokeRun') ?: 'manual'}/server"
        property 'weights.smoke.mode', 'dedicated'
        programArg 'nogui'
    }
}
