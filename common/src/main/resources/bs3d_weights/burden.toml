# BS3D Weights 有效负重系数（逻辑服务器读取，客户端不使用）。
# 有效负重 = 各来源实重 × 系数之和，按来源四舍五入到整克。
# 系数必须是非负数，可写整数或小数；0 表示该来源不计入有效负重。
# 六个键都必须保留，拼错或多出的键会让服务器拒绝启动。修改后重启服务器或重新进入单机世界生效。
# Weights 只负责计数，不设上限、不减速；惩罚由读取 Burden API 的附属决定。

# 原版快捷栏 0–8 号槽。
hotbar = 0
# 原版主库存 9–35 号槽；装了 bs3d_pocket 时只有 9–17 号槽。
main = 2
# 盔甲四格。
armor = 1
# 副手。
offhand = 1
# 打开界面时光标上拿着的物品。
cursor = 1
# BS3D 穿戴容器的自重及其全部内容。
worn_containers = 1
