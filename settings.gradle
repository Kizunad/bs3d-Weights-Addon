pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}
// 相邻仓库位置、产物路径与第三方版本都由 Framework 的工作区脚本提供（kizunaWorkspace、libs）。
apply from: new File(rootDir.parentFile, 'Kizuna-Meridian-Mod-Framework/scripts/workspace.gradle')

rootProject.name = 'bs3d-weights-addon'
include 'client', 'server'

// Inventory UI Framework 与 BS3D 尚无发布坐标；按清单目录组合其独立仓库，相关工程随本仓构建先行编译。
// 替换键一律用各工程自身的 group 与工程名，与 Human 等仓的登记一致：同一仓库在嵌套组合里只按最先登记的规则替换，键不一致时另一方解析不到。
kizunaWorkspace.includeSource('inventory-ui', ['': 'dev.kizuna.inventoryui:kizuna-inventory-ui-framework', server: 'dev.kizuna.inventoryui:server'])
kizunaWorkspace.includeSource('bs3d', [client: 'dev.kizuna.backpack3d:client', server: 'dev.kizuna.backpack3d:server'])
